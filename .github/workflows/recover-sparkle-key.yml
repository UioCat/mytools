name: One-time Sparkle key recovery

on:
  push:
    branches:
      - codex/sparkle-key-recovery

permissions:
  contents: write

jobs:
  recover:
    if: >-
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/codex/sparkle-key-recovery'
    runs-on: macos-26

    steps:
      - name: Check out reviewed recovery recipient
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify pinned recovery recipient
        run: |
          PUBLIC_KEY='scripts/signing/SparkleRecoveryPublicKey.pem'
          EXPECTED_FINGERPRINT='B60AE2F8777246E8509ABCCF292C33291CCEC97F8D251F07E6D6F0644CBA5908'
          ACTUAL_FINGERPRINT="$(
            openssl pkey -pubin -in "$PUBLIC_KEY" -outform DER \
              | shasum -a 256 \
              | awk '{ print toupper($1) }'
          )"

          test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT"
          printf 'Verified one-time recovery recipient: %s\n' "$ACTUAL_FINGERPRINT"

      - name: Encrypt existing Sparkle private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          test "${#SPARKLE_PRIVATE_KEY}" -le 400
          RECOVERY_OUTPUT="$RUNNER_TEMP/sparkle-private-key.rsa-oaep-sha256.enc"
          test ! -e "$RECOVERY_OUTPUT"
          umask 077

          printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | openssl pkeyutl -encrypt \
                -pubin \
                -inkey scripts/signing/SparkleRecoveryPublicKey.pem \
                -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 \
                -pkeyopt rsa_mgf1_md:sha256 \
                -out "$RECOVERY_OUTPUT"

          test -s "$RECOVERY_OUTPUT"
          chmod 600 "$RECOVERY_OUTPUT"

      - name: Publish encrypted recovery branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RECOVERY_OUTPUT="$RUNNER_TEMP/sparkle-private-key.rsa-oaep-sha256.enc"
          OUTPUT_BRANCH="codex/sparkle-key-recovery-output-$GITHUB_SHA"
          OUTPUT_PATH="recovery-output/$GITHUB_SHA.rsa-oaep-sha256.enc"
          RECOVERY_RECIPIENT_FINGERPRINT='B60AE2F8777246E8509ABCCF292C33291CCEC97F8D251F07E6D6F0644CBA5908'

          test -s "$RECOVERY_OUTPUT"
          test "$(git status --short)" = ''
          git switch -c "$OUTPUT_BRANCH"
          mkdir -p recovery-output
          cp "$RECOVERY_OUTPUT" "$OUTPUT_PATH"
          chmod 600 "$OUTPUT_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT_PATH"
          git commit \
            -m '写入一次性 Sparkle 加密恢复载荷' \
            -m "来源提交：$GITHUB_SHA
          收件公钥 SHA-256：$RECOVERY_RECIPIENT_FINGERPRINT
          内容：仅含 RSA-OAEP-SHA256 密文，不含明文密钥。"
          gh auth setup-git
          git push origin "$OUTPUT_BRANCH"

          printf 'Encrypted recovery output branch: `%s`\n' "$OUTPUT_BRANCH" >> "$GITHUB_STEP_SUMMARY"
