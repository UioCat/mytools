name: Release macOS DMG

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build-signed-app:
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Require GitHub-hosted runner
        run: |
          test "${GITHUB_ACTIONS:-}" = 'true'
          test "${RUNNER_ENVIRONMENT:-}" = 'github-hosted'

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_NUMBER="$(scripts/macos_build_number.sh "$VERSION")"
          printf 'MACOS_APP_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'MACOS_BUILD_NUMBER=%s\n' "$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Import anonymous signing identity
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/ci/import_anonymous_signing_identity.sh

      - name: Build stable signed app
        env:
          MACOS_SIGNING_MODE: stable
        run: scripts/package_app.sh

      - name: Retire local signing identity
        run: scripts/ci/cleanup_anonymous_signing_identity.sh ephemeral

      - name: Archive signed app
        run: tar -czf "$RUNNER_TEMP/MacTools-signed-app.tar.gz" -C build MacTools.app

      - name: Upload signed app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mactools-signed-app
          path: ${{ runner.temp }}/MacTools-signed-app.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

      - name: Clean up local signing identity
        if: always()
        run: scripts/ci/cleanup_anonymous_signing_identity.sh ephemeral

  release:
    needs: build-signed-app
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_NUMBER="$(scripts/macos_build_number.sh "$VERSION")"
          printf 'MACOS_APP_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'MACOS_BUILD_NUMBER=%s\n' "$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Download signed app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mactools-signed-app
          path: ${{ runner.temp }}/mactools-signed-app
          digest-mismatch: error

      - name: Restore signed app
        run: |
          mkdir build
          tar -xzf "$RUNNER_TEMP/mactools-signed-app/MacTools-signed-app.tar.gz" -C build

      - name: Verify app bundle on fresh runner
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/MacTools.app"
          CERTIFICATE_DIR="$(mktemp -d "${TMPDIR:-/tmp}/mactools-signing-cert.XXXXXX")"
          (
            cd "$CERTIFICATE_DIR"
            codesign -d --extract-certificates "$APP_PATH"
          )
          set +e
          TRUST_OUTPUT="$(LC_ALL=C security verify-cert -p codeSign -c "$CERTIFICATE_DIR/codesign0" 2>&1)"
          TRUST_STATUS=$?
          set -e
          test "$TRUST_STATUS" -eq 1
          grep -Fqx 'Cert Verify Result: CSSMERR_TP_NOT_TRUSTED' <<<"$TRUST_OUTPUT"

          codesign --verify --deep --strict --verbose=2 build/MacTools.app
          SIGNATURE_DETAILS="$(codesign -dv --verbose=4 build/MacTools.app 2>&1)"
          DESIGNATED_REQUIREMENT="$(codesign -d -r- build/MacTools.app 2>&1)"
          NORMALIZED_REQUIREMENT="$(tr '[:upper:]' '[:lower:]' <<<"$DESIGNATED_REQUIREMENT")"
          grep -Fqx 'Authority=MacTools Release Signing' <<<"$SIGNATURE_DETAILS"
          grep -Fq 'identifier "local.mactools.mvp" and certificate leaf = h"25a3263958804c6d9429eb51b97ba2b16ca1fb67"' <<<"$NORMALIZED_REQUIREMENT"
          ! grep -q '^Signature=adhoc$' <<<"$SIGNATURE_DETAILS"
          ! grep -Eqi '@|Apple Development|Developer ID' <<<"$SIGNATURE_DETAILS"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/MacTools.app/Contents/Info.plist)" = "$MACOS_APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/MacTools.app/Contents/Info.plist)" = "$MACOS_BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' build/MacTools.app/Contents/Info.plist)" = "AppIcon.icns"
          test -f build/MacTools.app/Contents/Resources/AppIcon.icns
          test -d build/MacTools.app/Contents/Frameworks/Sparkle.framework
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUEnableAutomaticChecks' build/MacTools.app/Contents/Info.plist)" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUAutomaticallyUpdate' build/MacTools.app/Contents/Info.plist)" = "false"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SURequireSignedFeed' build/MacTools.app/Contents/Info.plist)" = "true"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' build/MacTools.app/Contents/Info.plist)"
          LINKED_LIBRARIES="$(otool -L build/MacTools.app/Contents/MacOS/MacTools)"
          grep -F '@rpath/Sparkle.framework/' <<<"$LINKED_LIBRARIES" >/dev/null
          test "$(lipo -archs build/MacTools.app/Contents/MacOS/MacTools)" = "arm64"

      - name: Create and verify DMG
        run: |
          scripts/create_dmg.sh "${GITHUB_REF_NAME#v}" arm64
          hdiutil verify dist/*.dmg
          cd dist
          shasum -a 256 -c *.sha256

      - name: Inspect mounted DMG
        run: |
          MOUNT_DIR="$(mktemp -d "${TMPDIR:-/tmp}/mactools-release.XXXXXX")"
          DISK_DEVICE=""
          cleanup() {
            if [[ -n "$DISK_DEVICE" ]]; then
              hdiutil detach "$DISK_DEVICE" >/dev/null 2>&1 || true
            fi
            rmdir "$MOUNT_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ATTACH_OUTPUT="$(hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_DIR" dist/*.dmg)"
          DISK_DEVICE="$(printf '%s\n' "$ATTACH_OUTPUT" | awk '/^\/dev\/disk/ { print $1; exit }')"
          test -n "$DISK_DEVICE"
          test -d "$MOUNT_DIR/MacTools.app"
          test -L "$MOUNT_DIR/Applications"
          codesign --verify --deep --strict --verbose=2 "$MOUNT_DIR/MacTools.app"
          SIGNATURE_DETAILS="$(codesign -dv --verbose=4 "$MOUNT_DIR/MacTools.app" 2>&1)"
          DESIGNATED_REQUIREMENT="$(codesign -d -r- "$MOUNT_DIR/MacTools.app" 2>&1)"
          NORMALIZED_REQUIREMENT="$(tr '[:upper:]' '[:lower:]' <<<"$DESIGNATED_REQUIREMENT")"
          grep -Fqx 'Authority=MacTools Release Signing' <<<"$SIGNATURE_DETAILS"
          grep -Fq 'identifier "local.mactools.mvp" and certificate leaf = h"25a3263958804c6d9429eb51b97ba2b16ca1fb67"' <<<"$NORMALIZED_REQUIREMENT"
          ! grep -q '^Signature=adhoc$' <<<"$SIGNATURE_DETAILS"

      - name: Create release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="MacTools-v$VERSION-arm64-macos26.dmg"
          RELEASE_NOTES_FILE="dist/${DMG_NAME%.dmg}.md"
          PREVIOUS_TAG="$(git tag --sort=-version:refname | grep -v "^$GITHUB_REF_NAME$" | head -n 1 || true)"

          {
            printf '# MacTools %s\n\n' "$GITHUB_REF_NAME"
            printf '## 更新内容\n\n'
            if [[ -n "$PREVIOUS_TAG" ]]; then
              git log --no-merges --format='- %s' "$PREVIOUS_TAG..$GITHUB_SHA"
            else
              git log --no-merges --format='- %s' "$GITHUB_SHA"
            fi
            printf '\n## 安装说明\n\n'
            printf '1. 下载 DMG，将 MacTools.app 拖入 Applications。\n'
            printf '2. 首次打开时按系统提示在“隐私与安全性”中确认。\n'
            printf '3. 按功能需要授予辅助功能、输入监控、屏幕录制和 Finder Automation 权限。\n\n'
            printf '> 此版本开始使用固定匿名签名。首次从旧版迁移需要整理并重新授予一次权限；后续同签名更新会保持稳定应用身份。\n'
          } > "$RELEASE_NOTES_FILE"

      - name: Generate and verify signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          swift package resolve

          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="MacTools-v$VERSION-arm64-macos26.dmg"
          RELEASE_NOTES_FILE="dist/${DMG_NAME%.dmg}.md"
          APPCAST_INPUT_DIR="$(mktemp -d "${TMPDIR:-/tmp}/mactools-appcast.XXXXXX")"
          GENERATE_APPCAST=".build/artifacts/sparkle/Sparkle/bin/generate_appcast"
          SIGN_UPDATE=".build/artifacts/sparkle/Sparkle/bin/sign_update"

          test -x "$GENERATE_APPCAST"
          test -x "$SIGN_UPDATE"
          cp "dist/$DMG_NAME" "$APPCAST_INPUT_DIR/$DMG_NAME"
          cp "$RELEASE_NOTES_FILE" "$APPCAST_INPUT_DIR/${DMG_NAME%.dmg}.md"

          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/$GITHUB_REPOSITORY" \
            --embed-release-notes \
            --versions "$MACOS_BUILD_NUMBER" \
            --maximum-versions 1 \
            --maximum-deltas 0 \
            -o "$GITHUB_WORKSPACE/dist/appcast.xml" \
            "$APPCAST_INPUT_DIR"

          xmllint --noout dist/appcast.xml
          grep -q "<sparkle:version>$MACOS_BUILD_NUMBER</sparkle:version>" dist/appcast.xml
          grep -q "<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>" dist/appcast.xml
          grep -q 'sparkle:edSignature=' dist/appcast.xml
          grep -q '<!-- sparkle-signatures:' dist/appcast.xml
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" \
            --verify \
            --ed-key-file - \
            dist/appcast.xml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="MacTools-v$VERSION-arm64-macos26.dmg"
          CHECKSUM_NAME="$DMG_NAME.sha256"
          RELEASE_NOTES_FILE="dist/${DMG_NAME%.dmg}.md"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"
            if [[ "$IS_DRAFT" != "true" ]]; then
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "MacTools $GITHUB_REF_NAME" \
              --notes-file "$RELEASE_NOTES_FILE" \
              --verify-tag
          fi

          gh release upload "$GITHUB_REF_NAME" \
            dist/*.dmg \
            dist/*.sha256 \
            dist/appcast.xml \
            --clobber

          gh release edit "$GITHUB_REF_NAME" \
            --title "MacTools $GITHUB_REF_NAME" \
            --notes-file "$RELEASE_NOTES_FILE" \
            --draft=false

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="MacTools-v$VERSION-arm64-macos26.dmg"
          CHECKSUM_NAME="$DMG_NAME.sha256"
          VERIFY_DIR="$(mktemp -d "${TMPDIR:-/tmp}/mactools-release-assets.XXXXXX")"

          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "false"
          gh release download "$GITHUB_REF_NAME" \
            --dir "$VERIFY_DIR" \
            --pattern "$DMG_NAME" \
            --pattern "$CHECKSUM_NAME" \
            --pattern "appcast.xml"
          (
            cd "$VERIFY_DIR"
            shasum -a 256 -c "$CHECKSUM_NAME"
            xmllint --noout appcast.xml
            grep -q "<sparkle:version>$MACOS_BUILD_NUMBER</sparkle:version>" appcast.xml
            grep -q "<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>" appcast.xml
            grep -q 'sparkle:edSignature=' appcast.xml
            grep -q '<!-- sparkle-signatures:' appcast.xml
          )

          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/sign_update \
              --verify \
              --ed-key-file - \
              "$VERIFY_DIR/appcast.xml"

          for attempt in {1..10}; do
            curl --fail --location --retry 3 \
              "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" \
              --output "$VERIFY_DIR/latest-appcast.xml"
            if cmp -s "$VERIFY_DIR/appcast.xml" "$VERIFY_DIR/latest-appcast.xml"; then
              exit 0
            fi
            sleep 3
          done

          echo "latest appcast did not converge to $GITHUB_REF_NAME" >&2
          exit 1
